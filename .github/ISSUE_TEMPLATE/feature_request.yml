name: Feature request
description: Suggest an app, a setting, or an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: textarea
    id: apps
    attributes:
      label: If this is a new app
      description: Repository URL, branch that matches Frappe v16, and its license.
