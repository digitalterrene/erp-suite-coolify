# Builds the custom Frappe image (every app in apps.json) and pushes it to GHCR.
# Run manually: Actions -> "Build ERP suite image" -> Run workflow.
#
# Safety rules enforced by this workflow:
#   * every build needs a NEW tag (an existing tag is never overwritten)
#   * the image is built first and checked BEFORE it is pushed: if any app from
#     apps.json is missing from the image, the run fails and nothing is published
#   * apps.json is passed as a BuildKit secret, as frappe_docker now requires

name: Build ERP suite image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag, for example 2026-10-24-2 (never "latest", never reused)'
        required: true
      frappe_branch:
        description: 'Frappe framework tag or branch'
        required: true
        default: 'v16.51.1'

concurrency:
  group: build-image
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ inputs.tag }}
      FRAPPE_BRANCH: ${{ inputs.frappe_branch }}
    steps:
      - name: Validate tag
        run: |
          if ! [[ "$TAG" =~ ^[A-Za-z0-9._-]{1,128}$ ]] || [[ "$TAG" == "latest" ]]; then
            echo "::error::Tag must match [A-Za-z0-9._-] and must not be 'latest'."
            exit 1
          fi

      - name: Checkout this repository
        uses: actions/checkout@v7

      - name: Checkout frappe_docker (provides the Containerfile)
        uses: actions/checkout@v7
        with:
          repository: frappe/frappe_docker
          path: frappe_docker

      - name: Work out image name (GHCR requires lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/erp-suite" >> "$GITHUB_ENV"

      - name: Validate apps.json
        run: jq -e 'type == "array" and length > 0' apps.json

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to overwrite an existing tag
        run: |
          if docker manifest inspect "${IMAGE}:${TAG}" > /dev/null 2>&1; then
            echo "::error::${IMAGE}:${TAG} already exists. Choose a new tag."
            exit 1
          fi

      - name: Build image (not pushed yet)
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --load \
            --file frappe_docker/images/custom/Containerfile \
            --build-arg FRAPPE_PATH=https://github.com/frappe/frappe \
            --build-arg FRAPPE_BRANCH="${FRAPPE_BRANCH}" \
            --build-arg PYTHON_VERSION=3.14.0 \
            --build-arg NODE_VERSION=24.13.0 \
            --secret id=apps_json,src=apps.json \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.title=erp-suite" \
            --tag "${IMAGE}:${TAG}" \
            frappe_docker

      - name: Verify every app from apps.json is in the image
        run: |
          expected="$(jq -r '["frappe"] + [.[].url | split("/") | .[-1] | sub("\\.git$"; "")] | .[]' apps.json)"
          present="$(docker run --rm --entrypoint ls "${IMAGE}:${TAG}" -1 /home/frappe/frappe-bench/apps)"
          {
            echo "### Image ${IMAGE}:${TAG}"
            echo ""
            echo "Source commit: ${GITHUB_SHA}"
            echo ""
            echo "Apps found in the image:"
            echo '```'
            echo "${present}"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          missing=0
          for app in ${expected}; do
            if ! grep -qx "${app}" <<< "${present}"; then
              echo "::error::App '${app}' from apps.json is missing from the image."
              missing=1
            fi
          done
          if [ "${missing}" -ne 0 ]; then
            echo "::error::Not pushing an incomplete image."
            exit 1
          fi

      - name: Push image
        run: docker push "${IMAGE}:${TAG}"
