# Builds the custom Frappe image (every app in apps.json) and pushes it to GHCR.
# Run manually: Actions -> "Build ERP suite image" -> Run workflow.
# Every build needs a NEW tag. The workflow refuses to overwrite an existing tag.

name: Build ERP suite image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag, for example 2026-10-24 (never "latest", never reused)'
        required: true
      frappe_branch:
        description: 'Frappe framework tag or branch'
        required: true
        default: 'v16.51.1'

concurrency:
  group: build-image
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: Validate tag
        run: |
          if ! [[ "$TAG" =~ ^[A-Za-z0-9._-]{1,128}$ ]] || [[ "$TAG" == "latest" ]]; then
            echo "::error::Tag must match [A-Za-z0-9._-] and must not be 'latest'."
            exit 1
          fi

      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Checkout frappe_docker (provides the Containerfile)
        uses: actions/checkout@v4
        with:
          repository: frappe/frappe_docker
          path: frappe_docker

      - name: Work out image name (GHCR requires lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/erp-suite" >> "$GITHUB_ENV"

      - name: Encode apps.json
        id: apps
        run: echo "b64=$(base64 -w 0 apps.json)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to overwrite an existing tag
        run: |
          if docker manifest inspect "${IMAGE}:${TAG}" > /dev/null 2>&1; then
            echo "::error::${IMAGE}:${TAG} already exists. Choose a new tag."
            exit 1
          fi

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: frappe_docker
          file: frappe_docker/images/custom/Containerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=erp-suite
            org.opencontainers.image.licenses=MIT
          build-args: |
            FRAPPE_PATH=https://github.com/frappe/frappe
            FRAPPE_BRANCH=${{ inputs.frappe_branch }}
            PYTHON_VERSION=3.14.0
            NODE_VERSION=24.13.0
            APPS_JSON_BASE64=${{ steps.apps.outputs.b64 }}

      - name: List the apps that ended up in the image
        run: |
          {
            echo "### Built ${IMAGE}:${TAG}"
            echo ""
            echo "Source commit: ${GITHUB_SHA}"
            echo ""
            echo '```'
            docker run --rm --entrypoint ls "${IMAGE}:${TAG}" -1 /home/frappe/frappe-bench/apps
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
