name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install yamllint
        run: pip install --user yamllint
      - name: Lint YAML
        run: yamllint .
      - name: Validate apps.json
        run: |
          jq -e 'type == "array" and length > 0
                 and all(.[]; (.url | startswith("https://")) and (.branch | length > 0))' apps.json

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose.yaml
        env:
          SITE_NAME: erp.example.com
          ERPNEXT_IMAGE: ghcr.io/digitalterrene/erp-suite
          ERPNEXT_TAG: ci
        run: |
          # exclude_from_hc is a Coolify-only key that plain Docker Compose rejects.
          sed '/exclude_from_hc/d' compose.yaml > "$RUNNER_TEMP/compose.yaml"
          docker compose -f "$RUNNER_TEMP/compose.yaml" config --quiet

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color
