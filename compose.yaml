# ERPNext suite (ERPNext + HR + CRM + Helpdesk + Insights) for Coolify.
# Use with a NEW "Docker Compose Empty" resource (fresh volumes).
#
# Variables you must set in Coolify -> Environment Variables:
#   SITE_NAME      = the hostname you browse to (no https://, no port)
#                    e.g. erp.example.com
#   ERPNEXT_IMAGE  = your built image, lowercase, no tag
#                    e.g. ghcr.io/digitalterrene/erp-suite
#   ERPNEXT_TAG    = the tag you built and tested, e.g. 2026-10-24
# Optional:
#   INSTALL_APPS   = apps installed when the site is first created
#                    (default: hrms telephony crm helpdesk insights)
#
# Generated by Coolify (do not set by hand):
#   SERVICE_PASSWORD_DBROOT, SERVICE_PASSWORD_ADMIN, SERVICE_FQDN_FRONTEND_8080
#
# After the first deploy, set the domain of the `frontend` service to:
#   https://<SITE_NAME>:8080
# (:8080 only tells Coolify which container port to proxy to.)

services:

  # Run-once: writes db/redis hosts into sites/common_site_config.json.
  configurator:
    image: '${ERPNEXT_IMAGE:?Set ERPNEXT_IMAGE}:${ERPNEXT_TAG:?Set ERPNEXT_TAG}'
    restart: 'no'
    exclude_from_hc: true
    entrypoint:
      - bash
      - -c
    command:
      - >
        ls -1 apps > sites/apps.txt; bench set-config -g db_host $$DB_HOST; bench set-config -gp db_port $$DB_PORT; bench set-config -g redis_cache "redis://$$REDIS_CACHE"; bench set-config -g redis_queue "redis://$$REDIS_QUEUE"; bench set-config -g redis_socketio "redis://$$REDIS_QUEUE"; bench set-config -gp socketio_port $$SOCKETIO_PORT;
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - REDIS_CACHE=redis-cache:6379
      - REDIS_QUEUE=redis-queue:6379
      - SOCKETIO_PORT=9000
    volumes:
      - 'sites:/home/frappe/frappe-bench/sites'
      - 'logs:/home/frappe/frappe-bench/logs'

  # Run-once: creates the site, installs ERPNext, then installs the other apps.
  # Skips everything if the site already exists. First run takes several minutes.
  create-site:
    image: '${ERPNEXT_IMAGE:?Set ERPNEXT_IMAGE}:${ERPNEXT_TAG:?Set ERPNEXT_TAG}'
    restart: 'no'
    exclude_from_hc: true
    depends_on:
      configurator:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
    entrypoint:
      - bash
      - -c
    command:
      - |
        set -e
        wait-for-it -t 120 db:3306
        wait-for-it -t 120 redis-cache:6379
        wait-for-it -t 120 redis-queue:6379

        if [ ! -d "sites/$$SITE_NAME" ]; then
          echo "Creating site $$SITE_NAME ..."
          bench new-site "$$SITE_NAME" \
            --mariadb-user-host-login-scope='%' \
            --admin-password="$$ADMIN_PASSWORD" \
            --db-root-username=root \
            --db-root-password="$$DB_ROOT_PASSWORD" \
            --install-app erpnext \
            --set-default
          bench --site "$$SITE_NAME" set-config host_name "https://$$SITE_NAME"
        else
          echo "Site $$SITE_NAME already exists."
        fi

        # Install every requested app that is missing. Safe to run repeatedly,
        # so an interrupted run is completed by the next start.
        if ! installed="$$(bench --site "$$SITE_NAME" list-apps)"; then
          echo "ERROR: site $$SITE_NAME exists but is not usable." >&2
          echo "An earlier run was probably interrupted while creating it." >&2
          echo "On a fresh install, delete the stack including its volumes and deploy again." >&2
          exit 1
        fi
        installed="$$(echo "$$installed" | awk '{print $$1}')"

        for app in erpnext $$INSTALL_APPS; do
          if echo "$$installed" | grep -qx "$$app"; then
            echo "$$app is already installed."
          else
            echo "Installing $$app ..."
            bench --site "$$SITE_NAME" install-app "$$app"
          fi
        done
        echo "Done. Site $$SITE_NAME is ready."
    environment:
      - 'SITE_NAME=${SITE_NAME:?Set SITE_NAME, e.g. erp.example.com}'
      - 'DB_ROOT_PASSWORD=${SERVICE_PASSWORD_DBROOT}'
      - 'ADMIN_PASSWORD=${SERVICE_PASSWORD_ADMIN}'
      - 'INSTALL_APPS=${INSTALL_APPS:-hrms telephony crm helpdesk insights}'
    volumes:
      - 'sites:/home/frappe/frappe-bench/sites'
      - 'logs:/home/frappe/frappe-bench/logs'

  db:
    image: 'mariadb:11.8'
    restart: unless-stopped
    healthcheck:
      test: [ 'CMD', 'healthcheck.sh', '--connect', '--innodb_initialized' ]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 10
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
    environment:
      - 'MARIADB_ROOT_PASSWORD=${SERVICE_PASSWORD_DBROOT}'
      - 'MYSQL_ROOT_PASSWORD=${SERVICE_PASSWORD_DBROOT}'
    volumes:
      - 'db-data:/var/lib/mysql'

  redis-cache:
    image: 'redis:6.2-alpine'
    restart: unless-stopped
    healthcheck:
      test: [ 'CMD', 'redis-cli', 'ping' ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-queue:
    image: 'redis:6.2-alpine'
    restart: unless-stopped
    healthcheck:
      test: [ 'CMD', 'redis-cli', 'ping' ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - 'redis-queue-data:/data'

  backend:
    image: '${ERPNEXT_IMAGE:?Set ERPNEXT_IMAGE}:${ERPNEXT_TAG:?Set ERPNEXT_TAG}'
    restart: unless-stopped
    depends_on:
      configurator:
        condition: service_completed_successfully
    healthcheck:
      test: [ 'CMD', 'wait-for-it', '-t', '1', '127.0.0.1:8000' ]
      start_period: 30s
      interval: 15s
      timeout: 5s
      retries: 5
    volumes:
      - 'sites:/home/frappe/frappe-bench/sites'
      - 'logs:/home/frappe/frappe-bench/logs'

  websocket:
    image: '${ERPNEXT_IMAGE:?Set ERPNEXT_IMAGE}:${ERPNEXT_TAG:?Set ERPNEXT_TAG}'
    restart: unless-stopped
    depends_on:
      configurator:
        condition: service_completed_successfully
    command:
      - node
      - /home/frappe/frappe-bench/apps/frappe/socketio.js
    healthcheck:
      test: [ 'CMD', 'wait-for-it', '-t', '1', '127.0.0.1:9000' ]
      start_period: 30s
      interval: 15s
      timeout: 5s
      retries: 5
    environment:
      - FRAPPE_REDIS_CACHE=redis://redis-cache:6379
      - FRAPPE_REDIS_QUEUE=redis://redis-queue:6379
    volumes:
      - 'sites:/home/frappe/frappe-bench/sites'
      - 'logs:/home/frappe/frappe-bench/logs'

  frontend:
    image: '${ERPNEXT_IMAGE:?Set ERPNEXT_IMAGE}:${ERPNEXT_TAG:?Set ERPNEXT_TAG}'
    restart: unless-stopped
    depends_on:
      - backend
      - websocket
    command:
      - nginx-entrypoint.sh
    healthcheck:
      test: [ 'CMD', 'wait-for-it', '-t', '1', '127.0.0.1:8080' ]
      start_period: 30s
      interval: 15s
      timeout: 5s
      retries: 5
    environment:
      - SERVICE_FQDN_FRONTEND_8080
      - BACKEND=backend:8000
      - SOCKETIO=websocket:9000
      - 'FRAPPE_SITE_NAME_HEADER=${SITE_NAME:?Set SITE_NAME}'
      - UPSTREAM_REAL_IP_ADDRESS=127.0.0.1
      - UPSTREAM_REAL_IP_HEADER=X-Forwarded-For
      - UPSTREAM_REAL_IP_RECURSIVE=off
      - PROXY_READ_TIMEOUT=120
      - CLIENT_MAX_BODY_SIZE=50m
    volumes:
      - 'sites:/home/frappe/frappe-bench/sites'
      - 'logs:/home/frappe/frappe-bench/logs'

  queue-long:
    image: '${ERPNEXT_IMAGE:?Set ERPNEXT_IMAGE}:${ERPNEXT_TAG:?Set ERPNEXT_TAG}'
    restart: unless-stopped
    depends_on:
      configurator:
        condition: service_completed_successfully
    command:
      - bench
      - worker
      - --queue
      - long,default,short
    environment:
      - FRAPPE_REDIS_CACHE=redis://redis-cache:6379
      - FRAPPE_REDIS_QUEUE=redis://redis-queue:6379
    volumes:
      - 'sites:/home/frappe/frappe-bench/sites'
      - 'logs:/home/frappe/frappe-bench/logs'

  queue-short:
    image: '${ERPNEXT_IMAGE:?Set ERPNEXT_IMAGE}:${ERPNEXT_TAG:?Set ERPNEXT_TAG}'
    restart: unless-stopped
    depends_on:
      configurator:
        condition: service_completed_successfully
    command:
      - bench
      - worker
      - --queue
      - short,default
    environment:
      - FRAPPE_REDIS_CACHE=redis://redis-cache:6379
      - FRAPPE_REDIS_QUEUE=redis://redis-queue:6379
    volumes:
      - 'sites:/home/frappe/frappe-bench/sites'
      - 'logs:/home/frappe/frappe-bench/logs'

  scheduler:
    image: '${ERPNEXT_IMAGE:?Set ERPNEXT_IMAGE}:${ERPNEXT_TAG:?Set ERPNEXT_TAG}'
    restart: unless-stopped
    depends_on:
      configurator:
        condition: service_completed_successfully
    command:
      - bench
      - schedule
    volumes:
      - 'sites:/home/frappe/frappe-bench/sites'
      - 'logs:/home/frappe/frappe-bench/logs'

volumes:
  sites:
  logs:
  db-data:
  redis-queue-data:
